name: Reproduce the DBSCAN figures

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute the medians from the raw traces
        run: python analysis/dbscan_medians.py | tee output.txt
      - name: Compare with the published figures
        run: diff -u analysis/expected_output.txt output.txt
      - name: Convert a run to the energy-dashboard-for-kokkos trace format
        run: |
          python analysis/to_trace_v1.py data/fdbscan/illyad-2778967 trace
          head -2 trace/events.csv | grep -q '^1,0,DBSCANCalculation,USER_REGION,'
          test "$(wc -l < trace/power_samples.csv)" -eq "$(wc -l < data/fdbscan/illyad-2778967-nvml-power.csv)"
